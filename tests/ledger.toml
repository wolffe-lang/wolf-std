#   builtins in native lowering (checked lane only at s40)") and lupin is
#   behind the pin. One lane out of three is the measured reason D31's
#   nursery is where it lives; `x/json/path_helpers.lu` is its one two-lane
#   row, on the lazy-resolution rule again.
