# tests/ledger.toml — per-test, per-implementation expectations (sc00 §3,
# the is00 corpus-overlay pattern). The two implementations diverge by
# design; each test records what each one is expected to achieve TODAY:
#   lupin = "run" | "unsupported" | "slow"
#   wolfc = "run" | "unsupported" | "fail(E…)"
# "run" means: satisfies the directive's `check:` in full. A test passing
# deeper than its ledger claims fails CI — advancement is deliberate, in
# its own commit. "slow" (sc16, lupin only) means: the lane's SEMANTICS
# reach the program (its fast siblings are `run` there — that is what
# keeps the claim honest) but a tree-walk of the input blows the per-test
# ceiling by minutes, so the runner skips the lane and prints a slow
# ledger naming the row; a timeout-red would record the machine's speed
# rather than its depth, and `unsupported` would lie about its semantics.
# Every slow row is owed a re-measure at pin bumps; an interpreter perf
# wave is its exit.
#
# THE sc18 PIN BUMP (wolf trunk 87405ac -> 21b129e, the s110/s111 span;
# lupin UNCHANGED at 0.1.13 for the FOURTH sprint — is20's F-0093 fix is
# merged upstream but unreleased, so every `slow` row keeps its 0.1.13
# measurement) MOVED FORTY-ONE ROWS, all one column and one direction:
# wolfc `unsupported` -> `run`, because s111 landed the wrapping family
# on the checked tier (F-0091 / wolf-lang#130 closed — shifts, bitwise
# and 2^63+ literals all execute at mem now, re-probed four lines at a
# time at the sha). The flips: all 4 dark std.rand rows (the F-0026-era
# posture at its oldest address), all 18 dark sha2 rows that fit the
# tier's budgets, and all 19 dark chacha20 rows. What did NOT flip, and
# why, stated so the next bump reads a mechanism rather than a mystery:
# the 9 big sha2 vector rows (cavp long x3, monte x3, wycheproof full
# x3) stay wolfc `unsupported` because the checked tier's REFUSAL
# CHANGED KIND under them — the operator refusal is gone and what
# answers now is a resource budget ("step budget exhausted" on monte/
# full, "shadow-memory budget exhausted" on the long sets), the
# miri-lite's own capacity posture, measured per-file at the bump. A
# budget is not an operator gap: the same module's short files run on
# the same lane, so the semantics are measured and `unsupported` here
# records capacity. s111 also closed sc16's three NATIVE findings
# (F-0089/#131 narrowing wrapping casts, F-0090/#132
# List[wrapping[u64]], F-0092/#133 f(mut param.field)) — each re-probed
# green at the sha; no current ledger row observed those shapes, so no
# row moves on them (the sha2 workarounds they forced are retirement
# candidates recorded in the sc18 status notes, not silently rewritten
# in a bump commit).
#
# THE sc16 PIN BUMP (wolf trunk 1b149ba -> 87405ac, the s109/s110 span;
# lupin UNCHANGED at 0.1.13 — a compiler-only bump again) MOVED ONE ROW:
# `x/option_flatten/flatten_propagate` native `unsupported` -> `run`,
# because s109 RULED nested rows to FLATTEN ([gram.type.row.flatten]) and
# the native rung executes the flattened row. Every other row answers
# byte-identically at the new binary, measured before a single sc16 edit.
#
# THE sc15 PIN BUMP (wolf trunk dd6d13c -> 1b149ba, ~240 commits; lupin
# UNCHANGED at 0.1.13 — a compiler-only bump) MOVED TWENTY ROWS, every
# wolf-lane column that the three crossing waves reach, and rewrote none:
# - **s107 (json + process cross natively — "the last checked-lane-only
#   arms fall").** The four `x/json` native columns flip `unsupported` ->
#   `run` (`path_helpers.lu` becomes the module's first three-lane row),
#   and the four runnable `process` native columns follow. This is the
#   bump sc15's DOM half lands on: its seven new rows enter two-lane on
#   their first commit rather than flipping later.
# - **s106 (net crosses; the s39 arm falls).** Seven `net` native columns
#   flip `unsupported` -> `run`. A deadline also EXISTS upstream now
#   (read_deadline), so F-0049's "no builtin can arm a deadline" is stale;
#   `std.net` does not wrap it yet and that doc debt is named in
#   vendor/tools.toml as owed to the next os sprint.
# - **s108 (the front end pays its debts) plus the c22 dispatch span.**
#   `testing/assert_eq_trap`, `assert_ne_trap` and
#   `x/list_eq/contains_and_index_of` run on the CHECKED tier now —
#   primitive-receiver `Eq` dispatch executes there (F-0082's checked half
#   moves; native is unmoved and lupin still answers "i64 has no method").
#   `x/option_expect/expect_trap` splits: E0401 is gone (F-0040's
#   rejection retired), native RUNS the trap, and the checked machine now
#   refuses "control flow in an argument" at mem — an advance wearing an
#   unsupported verdict. `x/option_flatten/flatten_propagate` loses its
#   `fail(E0201)` pair: nested rows PARSE (#34) and sema refuses their
#   meaning by name at resolve, both wolf lanes.
# The lupin column moved NOWHERE, by construction: the interpreter did not
# change. The x/json lupin columns in particular stay dark as a POSTURE
# while is18 lands that machine's own json reading — the sc15 test files
# are written to flip on that pin bump with no edit.
#
# THE sc11 PIN BUMP (wolf trunk e94b879 -> 0b4e79c, five waves — s71, s72,
# s51, s41, s73 — plus the r01 identity release; lupin 0.1.6 -> 0.1.8) MOVED
# SEVEN ROWS and rewrote three test files. Every movement is an advance, and
# they come from three upstream changes:
# - **lupin gained the s40 `time_*`/`env_*` tiers** (its pin jumped two waves,
#   to 26fa98e): `time/monotonic.lu` and `env/variable_round_trip.lu` are
#   `run` on the interpreter lane. The sc10 note called that absence a DRIFT
#   rather than a design refusal and predicted it would close on a release;
#   it did. `env/args_and_vars.lu` did NOT move, and the reason is ONE
#   builtin: `env_vars` "does not resolve" at 0.1.8 while `env_args`,
#   `env_get`, `env_set`, `os_cwd` and `os_exit` all run (F-0070, measured one
#   call at a time). Four fifths of a family is not the family. And
#   `x/json/*` did not move either, but for a new reason: lupin now DECLINES
#   the json surface by design ("rather than risk a second, guessed RFC 8259
#   reading"), so those three dark columns are a posture, not a wave.
# - **s71 ruled the handler pattern** (`else |Tag(p)|` must cover the row,
#   E0809, and binds the payload): `errors/coarsen_and_chain.lu` was
#   `fail(E0806)` on both compiler rungs for four sprints and is `run` on all
#   three lanes now. F-0043's surviving half is closed.
# - **s72's D40 gave iteration exclusivity teeth** (E1013 via the loop-extent
#   read claim; `for` no longer moves its iterable):
#   `list/mutate_while_iterating.lu` is now `mutate_while_iterating_trap.lu`,
#   `trap(exclusivity)` under lupin — which used to run it silently — and
#   `fail(E1013)` where it used to be `fail(E1001)`. F-0014 is closed, and the
#   row is a rewrite rather than a movement.
# Two more file rewrites carry no row movement at all, because the answers
# they assert changed while the depth did not: s71 DEFINED the empty needle
# (`[mem.str.empty]`) so `split_empty_separator_trap.lu` and
# `replace_empty_pattern_trap.lu` lost their traps, their guards and their
# `_trap` names, and it ruled a negative `repeat` to be `assert` rather than
# `bounds` (`[mem.str.repeat]`), which turned `repeat_negative_trap.lu` red
# inside a minute of the bump.
#
# THE sc08 PIN BUMP (wolf trunk f0da6e6 -> 13b811f, the #40 merge; lupin
# 0.1.4 -> 0.1.5) MOVED 44 ROWS, all `unsupported` -> `run`, and 41 of them
# are in ONE column: the native rung went from 23 of 136 rows to 64. #40
# landed native `str`, `List` and the fs/io builtin tier together, so the
# refusals this ledger has recorded since sc04 ("the native rung refuses
# `str`", "... `List`", "... `print`") are gone in one bump and both os
# modules gained a second executing lane. The other three rows: lupin picked
# up `fs/path_helpers.lu` (0.1.5 has the whole 18-method builtin `str` set —
# F-0018's interpreter half, retired) and `io/writers_and_streams.lu` (0.1.5
# has `eprint`/`eprint_raw`), and wolfc picked up `str/to_strbuf_round_trip.lu`.
#
# THE `unstable(...)` VOCABULARY IS RETIRED AND NOTHING USES IT. F-0048 (the
# checked lane answering the same program two ways at random) is CLOSED
# upstream and re-measured closed here: 14 consecutive runs of each of the two
# files, all `exit(0)`, where sc07 measured 5 of 12. Both rows are plain `run`
# now. The parser still accepts the spelling and `xtask/src/ledger.rs` still
# documents it, because the honest record of a nondeterministic pin is worth
# keeping available — but a row here should be rare enough to be shocking.
#
# Paths are slash-relative to tests/.
#
# The sc01 pattern of rows (each stated in the test header too):
# - rows/enums/traits execute under lupin only where no user METHOD or
#   type-path expression is involved (F-0002); wolfc's checked tier
#   refuses rows, enums and trait dispatch at the run rung with an
#   honest `unsupported` after proving the static ladder through mem.
# THE sc07 PIN BUMP (wolf trunk 29a9d9c -> f0da6e6, both ritual gates green
# in a clean scratch clone) MOVED 51 ROWS, all in the wolfc column and all
# in the same direction: `unsupported` -> `run`. Five fan-out lanes landed
# at once and three of them reach this repo — s37's builtin `str` surface on
# the checked lane (18 methods including `get`, `find`, `rfind`, `split`),
# s38's format specs and the f64 tier in the checked machine, and — the one
# that unlocked the most rows — row RAISES executing across a module
# boundary, which retires F-0015 and with it every "the miss path is
# lupin-only" row this ledger carried since sc02. Two rows moved the other
# way and are recorded as held rejections rather than advances:
# `errors/coarsen_and_chain.lu` is `fail(E0806)` on both compiler lanes
# because a payload pattern in an `else` handler is now refused as
# refutable (F-0043 — §13's own row-expectation convention, rejected), and
# the two `round_trip` tests needed `else copy empty` where they had `else
# empty`, because an `else` fallback naming a container MOVES it (a test
# fix, not a ledger movement).
#
# - `(mut xs).push` — the X1-correct spelling — was E0804 under wolfc's
#   sc01/sc02 List typing (F-0005). CLOSED at the sc03 pin (12ae8c2,
#   wolf-lang#6): the mode-spelled receiver is now the ONE legal spelling
#   in both implementations and `.len`-then-`[i]` is a copy-read, so every
#   std body and test writes `(mut xs).push(v)` and no row here says
#   fail(E0804) any more.

[tests."prelude/prelude_smoke.lu"]
lupin = "run"
# The sc00 plan expected `unsupported` here; the pinned wolf (f1f9d80)
