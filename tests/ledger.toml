# `wrapping[u64]` (the sc20 spelling), so the F-0091-era checked refusals
# never bite. Every vector is RFC 8448 §3 (every handshake message
# byte-for-byte, every intermediate transcript hash, the full early ->
# handshake -> master schedule with the X25519 agreement, both Finished
