# native rung refuses it by name ("process builtins in native lowering
# (checked lane only at s40)"), refusing the whole module with it, pure
# builder included, because lowering budgets a module by more than the body it
# needs. Two files escape that shape and both for reasons this ledger has
# recorded before: `builder.lu` calls only pure members and lupin resolves
# module bodies lazily, and the two rejection witnesses never reach lowering.
#
# **No test here starts a real program**, and that is portability rather than
# timidity: no program exists on every tier-1 host, a wolf program cannot
# learn its own path (`env_args` drops argv[0]), and the directive schema has
# no per-platform gate (F-0066). Every witness is deterministic on all of
# them — a name no host has, an empty argv, a forged handle.

