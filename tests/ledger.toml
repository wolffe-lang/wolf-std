# ---- sc23: std.x.crypto.p256 — the Weierstrass curve (NIST P-256) and
# ECDSA (FIPS 186-5 / SEC1 / SP 800-186 / RFC 6979). The field is
# checked `int` in sixteen 16-bit Solinas limbs; the scalar field mod n
# is base-2^16 Montgomery; both are NO-wrapping, so the FIELD is
# three-lane. The distinction from sc18: a P-256 scalar multiplication
# is a TABLE-FREE ladder over the COMPLETE (RCB) formulas — ~2x heavier
# per step than curve25519's Montgomery ladder AND it does a
# double-AND-add every iteration — so ONE scalar mult exceeds lupin's
# 50M evaluation-step budget and the checked tier's step budget. Every
# scalar-mul-bearing file is therefore NATIVE-ONLY (lupin/wolfc
# `unsupported`, a step-budget verdict — NOT `slow`, which is a
# wall-clock timeout of a program that would finish; the interpreter
# actively refuses here). The three-lane differential is the field /
# DER / early-reject / trap files, whose executed paths never reach a
# ladder (the sc17 per-executed-path rule). Native runs everything (a
# 64-vector Wycheproof part is ~0.5s of compiled code).

