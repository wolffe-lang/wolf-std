# ---- sc12 (02-os): the fs surface std was writing around ----
# THE sc12 PIN BUMP is wolf trunk `27cdb14` -> `02c1e88` (s90 the fs surface,
# s88 four holes a newcomer finds first, s89 a byte view that can cross a
# call, plus the lane-coverage ratchet) with lupin UNCHANGED at 0.1.12. Both
# ritual gates green at the sha on the FIRST attempt, exit codes written to a
# file as they happened rather than read off a summary line (F-0063's
# lesson). Seventh clean pair, so F-0054 stays open on the reasoning it has
# stayed open on since sc09.
#
# **TWO ROWS MOVE FROM THE BUMP ALONE**, both advances, both measured before
# a single edit to `std/` (the rows themselves are up in their own sections):
#
# - `fmt/parse_bool.lu` [native] `unsupported` -> `run`. F-0076 is CLOSED
#   (s88's #100, "native: two bools can be compared"): `bool == bool` was
#   `unsupported — comparison outside integers/floats` on the native rung,
#   which is the one thing that file does, and its native column had been
#   dark for six sprints with nothing beside it saying why until sc13 named
#   the mechanism. std's bodies are unchanged — the workaround the finding
#   prescribed (`!p` rather than `p == false`) costs nothing and stays.
# - `str/byte_view_index.lu` [wolfc] `unsupported` -> `run`. F-0071 is CLOSED
#   on the checked lane (s88's #85, "a temporary can be read from"):
#   `s.bytes()[i]`, `.get(i)`, `.first()`, `.last()` and `.count()` were all
#   `unsupported` at `mem` and all five execute now, re-measured one shape at
#   a time. `std.str`'s walks did NOT go back to indexing — the one-pass
#   state machine is shorter than what it replaced — so the closure moves a
#   row and no body, which is the honest result and is said out loud in the
#   test header.
#
# **Nine rows are NEW.** Six in `tests/fs` (the s90 surface: bytes,
# directories, metadata, the real append, and the three row litmuses — two of
# them tags this module did not have and one, `utf8`, declared since sc07 and
# unwitnessable until a program could write a file that is not text), one in
# `tests/bytes` (the s89 lend, three lanes), and two in `tests/str` (F-0071's
# closure, split from its surviving half).
#
# The fs posture is unchanged and re-measured: the checked tier and the
# native rung execute, lupin refuses. What DID change is the SHAPE of
# lupin's refusal, and it is worth a line because it is the only thing here
# that reads like drift: the s38 names get that machine's reasoned decline
# ("this machine has no filesystem ... by design, so the fs tier is declined
# rather than mocked") while the s90 names get the generic unknown-name
# refusal (``unsupported: `fs_read_dir` does not resolve``). No lane moves
# either way — lupin has no filesystem under either sentence — but a reader
# cannot tell a posture from drift, which is F-0070's shape a third time and
# is filed as F-0081.

