          # to blame acquisition without this log contradicting it.
          ls -l .wolf-bin
          ".wolf-bin/wolf$exe" --version
          ".wolf-bin/lupin$exe" --version
      - name: lint-conventions
        run: cargo xtask std-test --lint-conventions
      - name: gen-vectors --check
        # ADVISORY ON THIS LANDING ONLY, and this is the step F-0114 was
        # about: with a `wolf` on the box it stops being an
        # inventory-and-derivability check and goes back to the BYTE
        # comparison, on windows for the first time ever.
        continue-on-error: true
        run: cargo xtask gen-vectors --check
      - name: doc-examples
        # ADVISORY ON THIS LANDING ONLY. Doc truth, executed on a runner
        # for the first time in this repository's history — and the net
        # examples have never run on windows at all (F-0113 said to
        # expect this run to teach something rather than to pass).
        continue-on-error: true
        run: cargo xtask doc-examples
      - name: ulp
        # ADVISORY ON THIS LANDING ONLY. The float budget compares the
        # last bit across every lit lane; three of them are lit now.
        continue-on-error: true
        run: cargo xtask ulp
