# 3-OS CI (sc00 §7). Binary-dependent lanes are conditional on
# acquisition and SKIP loudly when dark — silence is what turns a lane
# dark (ls00). The private upstream submodule is never cloned here; the
# tracked vendor/ snapshot keeps sync-pin honest in CI.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rig:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # No `submodules:` — upstream/ is private and CI cannot clone it
        # (deploy keys disabled org-side); sync-pin runs snapshot-only.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (rig internals; binary-guarded tests SKIP loudly)
        run: cargo test --workspace
      - name: sync-pin
        run: cargo xtask sync-pin
      - name: acquire implementation binaries (release artifacts keyed by pin)
        shell: bash
        run: |
          # Pre-M1 honesty: neither upstream publishes release binaries
          # yet, and the repos are private to this workflow's token. When
          # releases keyed by the pins in vendor/tools.toml exist (and a
          # readable token is configured), download into .wolf-bin/ here.
          # Until then this lane is dark and says so:
          echo "SKIP: no lupin release artifact at pin $(sed -n 's/^pin = \"\(.......\).*/\1/p' vendor/tools.toml | head -1) — lupin lane dark"
          echo "SKIP: no wolf release artifact at pin $(sed -n 's/^pin = \"\(.......\).*/\1/p' vendor/tools.toml | tail -1) — wolfc lane dark"
      - name: doctor
        run: cargo xtask doctor
      - name: ledger-check
        run: cargo xtask ledger-check
      - name: std-test (lanes conditional on binaries; SKIPs are loud)
        run: cargo xtask std-test

  # sc41 / F-0113 / wolf-std#13 — the lane nothing lit.
  #
  # `cargo xtask ci` runs eleven steps; the `rig` job above runs seven of
  # them. The four below — lint-conventions, gen-vectors --check,
  # doc-examples and ulp — had never executed on a runner in this
  # repository's history, which is why a broken `net.write` doc example
  # (F-0112) was green on all three platforms for four sprints: no runner
  # has ever executed a `wolf-doc-example`. They run here, in the gauntlet's
  # own order, one job per host.
  #
  # Deliberately NOT `needs: rig`. `ci()` is fail-fast, so locally these
  # four really do come after the seven; but a job that is skipped when the
  # seven are red teaches nothing on the run where it is most needed, and
  # the whole point of this lane is to be read. Ordering is preserved
  # WITHIN the job; the two jobs are independent across it.
  #
  # WALL-TIME BUDGET, written before the first run (docs/findings.md, "The
  # sc41 CI lane"): ubuntu 6 min, macOS 7 min, windows 20 min, whole job,
  # checkout and cargo build included. `timeout-minutes: 45` on the first
  # landing so a blown budget is reported as a measurement and not
  # truncated into a timeout.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # FIRST LANDING ONLY (sprint item 1): report without gating. Dropped in
    # item 2 once the lane is green on all three hosts twice; whatever step
    # cannot be made green stays advisory BY NAME, with its finding beside
    # it, and never as a blanket job-level flag.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: acquire implementation binaries (release artifacts keyed by pin)
        shell: bash
        run: |
          # Same pre-M1 honesty as the rig job: no release artifacts exist
          # at the pins, so all three observation lanes are dark here and
          # doc-examples/ulp do their STATIC half only. That half is not
          # nothing — it is 421 staged packages and a 7.3 MB corpus
          # re-derived — but it is not doc TRUTH, and this comment is the
          # place that says so rather than a green check mark implying it.
          echo "SKIP: no lupin release artifact at pin $(sed -n 's/^pin = \"\(.......\).*/\1/p' vendor/tools.toml | head -1) — lupin lane dark"
          echo "SKIP: no wolf release artifact at pin $(sed -n 's/^pin = \"\(.......\).*/\1/p' vendor/tools.toml | tail -1) — wolfc lane dark"
      - name: lint-conventions
        run: cargo xtask std-test --lint-conventions
      - name: gen-vectors --check
        run: cargo xtask gen-vectors --check
      - name: doc-examples
        run: cargo xtask doc-examples
      - name: ulp
        run: cargo xtask ulp
