# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; `wolf` names none of its own
# — and as of 0.1.0 it names its PAIRING instead, on a second line
# ("paired with lupin 0.1.8 (reference interpreter), pin 7886559"). That
# sha is the INTERPRETER's commit in wolf-interp, not a wolf-lang commit,
# so the rig reads identity from the first line only and reports the
# pairing without gating it (F-0064, and the doctor line that shows it).
# The two binaries may lawfully sit at different wolf-lang pins (two
# moving upstreams); the nightly lane watches the drift, report-never-gate.

