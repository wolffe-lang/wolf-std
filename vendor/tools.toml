# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; `wolf` names none of its own
# — and as of 0.1.0 it names its PAIRING instead, on a second line
# ("paired with lupin 0.1.8 (reference interpreter), pin 7886559"). That
# sha is the INTERPRETER's commit in wolf-interp, not a wolf-lang commit,
# so the rig reads identity from the first line only and reports the
# pairing without gating it (F-0064, and the doctor line that shows it).
# The two binaries may lawfully sit at different wolf-lang pins (two
# moving upstreams); the nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.12 (sc14 bump, from 0.1.11). Its own conformance pin is `4e316ad`,
# which is the sc13 `wolf` pin exactly — the interpreter names the compiler
# sha this repository held one sprint ago, for the second bump running.
#
# What the bump changes for this repo, re-measured one call at a time:
# - **`str_from_utf8` RESOLVES HERE NOW** (F-0075 CLOSED, one release after
#   it was filed): `str_from_utf8([195, 169])` is `é` and `[255]` is the
#   `utf8` row, measured with the finding's own reproducer. Two ledger rows
#   flip (`bytes/to_str_border.lu`, `bytes/to_str_row.lu`: `unsupported` ->
#   `run`), `std.bytes.to_str` has three lanes, and — the reason this
#   sprint could be written at all — `std.json.unescape` has a lane, since
#   the interpreter is that module's only executing one.
# - **`List.push` is LINEAR here now** (wolf-interp#24 fixed, F-0074's
#   first half): 32k pushes go 30.33s -> 0.191s upstream's measurement, and
#   this repo's slowest test agrees (`fmt/decimal/shortest_round_trip.lu`,
#   24.8s at 0.1.11, see the sc14 census row). The fix is a LEND of the
#   receiver rather than four whole-value copies per method call.
# - **The INDEX READ is not fixed and is the other half** (F-0078, filed
#   here): `xs[i]` on a `List` binding is O(n), so a 16k-element walk by
#   index is 3.4s where the same walk by `for` is 0.107s, and passing a
#   `List` as a read ARGUMENT copies it per call (20k calls over a 20k list:
#   58s). `std.json`'s scanner is written over `str.get` because of it.
# - **F-0036 is UNMOVED here**: a row tag that shares a name with a function
#   in scope resolves to the FUNCTION and rides out as a value with no
#   `else` firing (measured with a `parse` tag beside a `parse` fn). That is
#   why `std.json.unescape` raises `syntax`.
# - **F-0029 is unmoved**: an importer still cannot `match` on an enum an
#   imported module produced, so `std.json` keeps its one lane and every
#   inspection stays inside the declaring module.
# What it does NOT change: no `fs_*`, no `read_line`, no `net_*`, no
# `json_*`, no process trio (all declined by design, each with a sentence),
# and `var k = 0` is still `i32`.
#
# The sc13 note, kept for the history it records:
# 0.1.11 (sc13 bump, from 0.1.10). Its own conformance pin is `f8dca42`,
# which is the sc12 `wolf` pin exactly — so for the first time the
# interpreter names the compiler sha this repository held one sprint ago,
