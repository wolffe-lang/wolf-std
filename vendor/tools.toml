# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; wolf pre-M1 names none
# ("wolf 0.0.1 (wolfgang)") — doctor reports that pin as trusted from
# acquisition, unverifiable from the binary. Note the two binaries may
# lawfully sit at different wolf-lang pins (two moving upstreams); the
# nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.4 (sc06 bump, tag v0.1.4): the maintenance wave, and it moves this
# repo's ledger for the first time in three bumps.
# - **#15, E1007 is STATIC now**: a call that omits `mut` where the
#   signature demands it was a silent wrong answer (the writeback never
#   happened) and is a resolve-rung rejection at this pin, matching
#   wolfc's code and span. std writes the X1-correct spelling everywhere
#   since sc03, so nothing in the tree moved — but the shape is now
#   REJECTED rather than run-wrong, which is what makes `std.testing`'s
#   mut-receiver examples safe to write.
# - **#14, integer literals consult their context**: `INT_MIN` is
#   writable in every annotated spelling and a declared return type types
#   the value a call returns (`math.int_max() - 1` no longer traps), so
#   two thirds of F-0025 retires. `var k = 0` is still `i32` — the rule
#   wolfc implements, now documented rather than a bug.
# - #13 (`calloc` multiplies) and #11 (the cast matrix, re-closed after
#   sc04's reopen) touch nothing std writes.
# What this bump makes WRITABLE is the sprint: rows in parameter and
# `let` position execute (0.1.3 landed them; sc06 is the first sprint to
# use them), so `std.option`'s six helpers land, and a payload-carrying
# tag destructures at the handler (`else |Parse(p)| { … p.offset }`),
# which is what `std.errors` is made of.
# lupin names its own conformance pin ad6cef7 in `--version` (s30
# remainder); wolf sits at 29a9d9c. The two binaries at different
# wolf-lang pins is the lawful two-upstream drift the header describes,
# and the nightly lane watches it.
version = "0.1.4"
pin = "ad6cef7fc97701accde0997594e62cf9c63ec5e5"

[wolf]
version = "0.0.1"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver -p wolf_rt.
# sc06 bump: trunk 29a9d9c — M1's far side. Between 6bfff9a and here,
# trunk landed the wir (entity arenas, block-parameter SSA, the data
# table with `str` as ptr+length), `print` lowering to per-segment
# runtime writes, **`wolf build` and `wolf run`** with the lu-cache, the
# debuggable-binary work, and the corpus gate that compiles and RUNS 31
# phase-run programs natively with asserted directives. For this repo the
# capability that matters is the native rung getting steadier, not a new
# lane: the checked tier still refuses `str` methods, `f64` literals and
# `const` uses exactly as F-0026 maps them.
#
# THE SECOND GATE (F-0024's lesson, applied for the third time): "the
# last green trunk CI run" is not sufficient by itself, so the pin is
# verified by `cargo test --workspace` AND `cargo run -p xtask -- ci` in a
# clean scratch clone at the sha. Both are green at 29a9d9c.
#
# The native rung needs `libwolf_rt.a` beside the binary
# (`cargo build -p wolf_rt` at the same sha, or `$WOLF_RT_LIB`); doctor
# reports its absence and the lane goes dark rather than silent.
pin = "29a9d9c79334d708905aa8065b24b09855ccbe91"
