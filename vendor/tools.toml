# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; wolf pre-M1 names none
# ("wolf 0.0.1 (pre-alpha)") — doctor reports that pin as trusted from
# acquisition, unverifiable from the binary. Note the two binaries may
# lawfully sit at different wolf-lang pins (two moving upstreams); the
# nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.3 (sc05 bump, tag v0.1.3): the interpreter half of three interims
# closes at once — the numeric cast matrix lands, so `n as f64` CONVERTS
# (F-0022 / wolf-interp#11 retired, and `std.str.parse_float`'s ten-branch
# digit table with it); postfix rows resolve in every type position with
# EAGER raise resolution, so lowercase bare tags work at a raise site and
# `std.option`'s six helpers become writable (F-0023 / wolf-interp#12,
# F-0002); a method call on a slice-of-binding receiver runs (F-0021 /
# wolf-interp#10); and `assert(cond, msg)` evaluates its message only on
# the failing path. Every existing ledger row survives the bump unmoved:
# std's bodies were written around the four interims rather than on top of
# them, so the gain is what becomes WRITABLE (sc05's float work leans on
# the cast), not what starts passing.
# lupin names its own conformance pin d147a54 in `--version`; the two
# binaries sitting at different wolf-lang pins is the lawful two-upstream
# drift the header describes, and the nightly lane watches it.
version = "0.1.3"
pin = "d147a548fa114052fb070e5a7815acd0500fb3d9"

[wolf]
version = "0.0.1"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver.
# sc05 bump: trunk 6bfff9a ("s29 remainder") — the last green trunk CI run
# at sprint start, chosen while s30 is moving trunk underneath: the two
# commits after it (the abi/membrane batch) were still landing, so this is
# the last sha that satisfied BOTH gates rather than the newest sha that
# exists. s29 brings the unsafe tier's membranes and real glibc calls
# behind them, wolf-abi-0 (sysv-shaped aggregates, the convention version
# folded into mangling), and E0410 moving to the resolve rung — none of
# which std can execute yet, so the bump is a pin-hygiene bump rather than
# a capability bump: the checked tier still refuses `str` methods, `f64`
# literals and `const` uses exactly as F-0026 maps them.
#
# THE SECOND GATE (F-0024's lesson, applied for the second time): "the
# last green trunk CI run" is not sufficient by itself, so the pin is
# verified by `cargo test --workspace` AND `cargo run -p xtask -- ci` in a
# clean scratch clone at the sha. Both are green at 6bfff9a (no failing
# test binary; xtask reports "all steps green" across abi-check,
# spec-extract, conformance, print-gate, diag-catalog, fmt-lu,
# audit-surface and differ-self).
#
# The native rung needs `libwolf_rt.a` beside the binary
# (`cargo build -p wolf_rt` at the same sha, or `$WOLF_RT_LIB`); doctor
# reports its absence and the lane goes dark rather than silent.
pin = "6bfff9ac0f0198203cdf072e13d88cb6655953a7"
