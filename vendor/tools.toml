# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; `wolf` names none of its own
# — and as of 0.1.0 it names its PAIRING instead, on a second line
# ("paired with lupin 0.1.8 (reference interpreter), pin 7886559"). That
# sha is the INTERPRETER's commit in wolf-interp, not a wolf-lang commit,
# so the rig reads identity from the first line only and reports the
# pairing without gating it (F-0064, and the doctor line that shows it).
# The two binaries may lawfully sit at different wolf-lang pins (two
# moving upstreams); the nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.10 (sc12 bump, from 0.1.8 — 0.1.9 skipped, so this bump carries two
# releases). Its own conformance pin is `613c3dc`, which is an ANCESTOR of
# the `wolf` pin below (ten commits back, before s74/s53/s75/s78/s76/s77):
# the two-upstream drift is the narrowest this repo has ever recorded, and
# for the first time it is measured as a commit distance rather than as a
# list of waves.
#
# What the bump changes for this repo, re-measured one call at a time:
# - **F-0037 IS CLOSED** (wolf-interp#16): an enum returned through an
#   error row took the miss path on every call for five sprints —
#   `fn id(v: W) -> W ! {none} { v }` raised — and it returns the VALUE
#   now. The interpreter is `std.json`'s only lane, so this unblocks the
#   json DOM (`parse`, `get`, `at`) and retires API-CONVENTIONS §11's "no
#   std accessor returns an enum through an error row" as an interim.
#   Measured, not inferred, with the one-line reproducer the finding names.
# - **F-0032 is closed too** (wolf-interp#17): `s as nonsense` is `E0301`
#   at resolve spanning the type name, where it used to pass the value
#   through silently. `s as int` is `E0805`.
# - **the byte view runs here**: `for b in s.bytes()`, `s.bytes()[i]` and
#   `s.bytes().len` all execute (the interpreter materializes; the shape
#   is what matters to std, and it is legal on this lane).
# - **bytes-to-str is UNMOVED**, probed the same four ways sc11 used:
#   `str.from_utf8` does not resolve, `StrBuf.push_byte` is not a method,
#   `'h'` is `E0101` at the lexer, `bytes_to_str` does not resolve.
# What it does NOT change: no `fs_*`, no `read_line`, no `net_*`, no
# `json_*`, no process trio (all declined by design, each with a sentence),
# and `var k = 0` is still `i32`.
#
# The sc11 note, kept for the history it records:
# 0.1.8 (sc11 bump, from 0.1.6 — v0.1.9 exists and is deliberately not
# chased: a pin bump is a sprint's decision, not a release's). lupin 0.1.8
# is the release wolf 0.1.0 was differentially paired against, and it names
# `26fa98e` — the s72 merge — as its own conformance pin, two waves ahead of
# the 0.1.6 pin this repo held at sc10. The two-upstream drift is therefore
# NARROWER than at any point since sc07: the interpreter is behind the
# `wolf` binary below by s41 (llvm), s51 (the package manager), s73 (native
# conc) and the fmt fuzz work, and by nothing that std wraps.
#
# What the bump changes for this repo, all re-measured at the bump:
# - **the `time_*` family and FOUR FIFTHS of the os/env family EXECUTE here
#   now** (they arrived with s40, three waves after 0.1.6's pin):
#   `time_now_ms`, `time_unix_ms`, `time_sleep_ms`, `env_args`, `env_get`,
#   `env_set`, `os_cwd` and `os_exit` all run on the interpreter lane — two
#   ledger rows here plus `std.process`'s `exit`. The sc10 note called that
#   absence a DRIFT rather than a design refusal and said it would close on a
#   release rather than on a decision; it did, exactly that way. **The fifth
#   env call is missing**: `env_vars` "does not resolve" (F-0070), which is why
#   `tests/env/args_and_vars.lu` keeps its dark lupin column. Measured one
#   builtin at a time, because "the family landed" is the kind of sentence that
#   is four-fifths true and entirely wrong.
# - **`json_*` is DECLINED BY DESIGN, and that is a change of KIND rather
#   than of lane**: `json_valid` under 0.1.8 is
#   `unsupported: … its reference kernel is the counterparty's
#   `wolf_mem::json`, and this machine declines the surface rather than risk
#   a second, guessed RFC 8259 reading`. So `std.x.json`'s dark interpreter
#   column is now a posture like `fs`/`net`, not a wave of drift, and the
#   guide entry that said otherwise is corrected.
# - **the process trio is DECLINED BY DESIGN too** — `os_spawn` answers
#   `unsupported: … this machine runs no child processes by design, so the
#   tier is declined rather than mocked`. sc11's `std.process` therefore has
#   one executing lane from the day it lands, and the refusal is a sentence
#   rather than a gap.
# - `else |Tag(p)|` binds the payload here as it does on both compiler rungs
#   (s71/#43); the empty needle is DEFINED (`count("")` 0, `split("")` one
#   whole piece, `replace(s, "", …)` identity) and a negative `repeat` traps
#   `assert`, both on this lane too — F-0055 and F-0056 are closed and
#   `std.str`'s six guards are gone.
# What it does NOT change: no `fs_*`, no `read_line`, no `net_*` (all three
# declined by design, each with a sentence in the refusal), and `var k = 0`
# is still `i32`.
version = "0.1.10"
pin = "613c3dc2bdec3b151c23fc200227f3a6230f68c4"

[wolf]
version = "0.1.0"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver -p wolf_rt.
#
# sc12 bump: trunk `f8dca42`, which IS trunk's tip at the bump and is green
# on BOTH ritual gates on the FIRST attempt (`cargo test --workspace` = 0,
# `cargo run -p xtask -- ci` = 0, exit codes printed rather than inferred
# from a summary line — F-0063's lesson). Fourth clean pair in a row, so
# F-0054 stays open on the same reasoning it has stayed open on since sc09.
#
# Three concurrent compiler sprints (s79 bench, s80 token audit, s81 str
# equality) were in flight during this sprint and NONE of them is in this
# pin. That is deliberate: the pin is taken once and held, so a std sprint
# never chases a moving trunk. The consequence to record is s81's: if it
# lands a validating `List[int] -> str ! {utf8}` primitive, `bytes.to_str`
# becomes writable — at THIS pin it is not, probed four ways (below).
#
# What the bump brings, in the order it matters to std:
# - **s77 (#80): `s.bytes()` IS THE RECEIVER'S OWN POINTER AND LENGTH.** A
#   byte view is bit-identical to a `str` and to every zero-copy subslice
#   the runtime already returned, so there is one representation and one
#   lifetime story. Lowering reads the pair where it is CONSUMED —
#   iteration, indexing, `len`/`count`/`is_empty`/`get`/`first`/`last` — and
#   a byte walk emits no call and no allocation. `s[a..b]` and `s.get(a..b)`
#   stopped calling the runtime too (one inlined domain helper shared with
#   `get`, so `[mem.str.get]`'s law is literally the same code). THE CAVEAT
#   THAT SHAPES STD: every OTHER position — a `let` binding, an argument, a
#   return — still materializes through `__wolf_rt_str_bytes`, so the win is
#   inside one function body and a `std.bytes` function whose parameter is
#   `List[int]` cannot have it. That is why this sprint's rewrites are
#   `std.str`'s own walks and the encoders' digit probes, and why
#   `bytes.from_str` is unchanged.
# - **s76: containers allocate in the ambient region at the site.** A `List`
#   built inside `region r { }` is freed with it and growth stays in the
#   birth region. `std.list`'s header claim ("every function allocates in
#   the ambient region and no signature asks for one") was a promise about
#   the API and is now also true of the machine.
# - **s75: element access is a load, not a call** (`gep + load`), which is
#   the shape s77's byte view then reused at stride 1.
# - **s74/s78/s42/s43/s63/s53**: the correctness cluster, the aliasing
#   facts, the mid-end, whole-program, diagnostics polish, and `wolf doc` +
#   script mode. None of them moves a ledger row here; `wolf doc` is worth
#   naming because upstream now GENERATES api docs over this repository
#   (358 items, 357 documented, 309 with an example at e9f11f4), which makes
#   §4's doc discipline someone else's input.
# Re-measured at this sha rather than assumed:
# - the builtin `str` set is unchanged at 21 methods; `bytes()` changed its
#   LOWERING, not its surface, so nothing in std had to change to keep
#   working and everything in std that walks bytes could change to get
#   faster;
# - **F-0057 is UNMOVED and #58 is open**, probed the same four ways sc11
#   used: `str.from_utf8` does not resolve, `strbuf.push_byte` is not a
#   method, `'h'` is `E0101` at the lexer, no `bytes_to_str` builtin. s77's
#   own commit says why in the compiler's words: the view "cannot become a
#   `str`… a `List[int] -> str` conversion would have to VALIDATE (wolf-std's
#   `bytes.to_str`, still blocked, and this is why: it wants a checked
#   primitive, not a cast)". Four sprints, one answer, now with the
#   counterparty agreeing about the shape of the fix;
# - the process trio and `json_*` are still checked-lane only, refused
#   natively by name; net likewise;
# - `--deny-warnings` is STILL rejected by `conform-run` (F-0046/F-0053,
#   re-verified at this sha), so the warning gate remains the record's
#   `warnings` array, read on two lanes.
#
# The sc11 note, kept for the history it records:
# sc11 bump: trunk `0b4e79c` — FIVE merged waves (s71, s72, s51, s41, s73)
# plus the r01 identity release, and the first bump this repo has taken
# where trunk's HEAD was not the pin.
#
# **The pin is one commit BEHIND trunk's tip, deliberately.** `17ea078`
# (trunk HEAD at the bump) fails the first ritual gate: it banks an unfixed
# fmt fuzz class as `tests/regressions/unfixed/idem_class_six.lu.pending`,
# and `wolf_fmt`'s `fuzz_regressions` sweep walks that directory with
# `read_dir` + `fs::read`, so the sweep panics `IsADirectory` and
# `cargo test --workspace` exits 101 (F-0063, filed). `0b4e79c` is its
# parent, is green on BOTH gates on the first attempt, and contains every
# wave below.
#
# What the bump brings, in the order it matters to std:
# - **s71 (release polish)**: `else |Tag(p)|` is RULED — the handler pattern
#   must cover the row (E0809) and the payload binds on all three lanes, so
#   F-0043's surviving half is closed and `tests/errors/coarsen_and_chain.lu`
#   stops being a held rejection. The empty needle is DEFINED in the spec
#   (`[mem.str.empty]`: count 0, split one whole piece, replace identity)
#   and a negative `repeat` is ruled `assert` rather than `bounds`
#   (`[mem.str.repeat]`) — #56 and #57 closed, F-0055 and F-0056 with them,
#   and six guards plus one placeholder answer in `std.str` deleted.
# - **s72 (the mode rules get their teeth)**: D40 iteration exclusivity
#   (E1013 via the loop-extent read claim — `for` no longer MOVES its
#   iterable, so the E1001 accident sc02's single-read rule was built around
#   is structurally dead) and D39 read-mode teeth (E1014 for a callee-side
#   write through a read binding). Nothing in `std/` or `tests/` trips
#   either, re-measured; the single-read discipline stays in the guide as
#   history rather than law.
# - **s73 (native concurrency)**: scope/spawn/join, channels with region
#   payload transfer, select, `when`, and procs with monitor/kill/cancel all
#   lower natively now, with honest refusals that name their tier. std wraps
#   no concurrency surface at this pin (c05's closures and the task facade
#   are later sprints), so the ripple here is DOCUMENTARY and it is real:
#   every "the interpreter is the only machine that runs conc" sentence in
#   this repo's docs is now false, and the task-capture entries that said
#   the rejection was checked-lane-only are corrected.
# - **s41 (llvm lowering)** and **s51 (the package manager)**: a release
#   tier (`wolf build --release`) and `wolf add/audit/tree`. Neither is a
#   lane this rig observes — the ledger's three columns are unchanged — and
#   the capability audit `wolf audit` renders is the consumer of the
#   per-function I13 notes API-CONVENTIONS §14 makes std write.
# - **r01 (the identity release)**: `wolf 0.1.0 (wolfgang)`, paired with
#   lupin 0.1.8. Its two-line `--version` broke this rig's doctor until the
#   parser learned that a pairing line is not a pin (F-0064).
# Re-measured at this sha rather than assumed:
# - the process trio is CHECKED-LANE ONLY, unchanged from s40: the native
#   rung refuses by name ("process builtins in native lowering (checked lane
#   only at s40)"), which is `std.process`'s whole lane story;
# - the `json_*` four are still checked-lane only, refused natively by name;
# - the builtin `str` set is unchanged at 21 methods, and the three
#   empty-argument shapes now AGREE on all three lanes (see s71 above);
# - `--deny-warnings` is STILL rejected by `conform-run` (F-0046/F-0053,
#   re-verified at this sha: `unknown flag`), so the warning gate remains
#   the record's `warnings` array, read on two lanes;
# - F-0057 is UNMOVED and #58 is open: there is still no `str.from_utf8`, no
#   `strbuf.push_byte` and no `char`, so `std.bytes.to_str` stays a reviewed
#   contract for the third sprint running (probed, not assumed);
# - F-0037 (an enum through an error row is always a miss) is unmoved.
#
# THE SECOND GATE (F-0024's lesson, applied for the eighth time): the pin is
# verified by `cargo test --workspace` AND `cargo run -p xtask -- ci` in a
# clean scratch clone at the sha. At `17ea078` the first gate is RED
# (F-0063); at `0b4e79c` both are green **on their first attempt**, which is
# the third clean pair in a row, so F-0054 stays open on the same reasoning
# (three clean pairs are not proof a timing dependence is gone) and the
# posture remains "state the attempt count in this note".
#
# The native rung needs `libwolf_rt.a` beside the binary
# (`cargo build -p wolf_rt` at the same sha, or `$WOLF_RT_LIB`); doctor
# reports its absence and the lane goes dark rather than silent. It executes
# the fs/io, os/env/time and (new at s73) concurrency tiers, and refuses the
# net, process and json tiers by name.
pin = "f8dca42118a944a801b7a6d2709004ccfeb01572"
