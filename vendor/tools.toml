# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; wolf pre-M1 names none
# ("wolf 0.0.1 (pre-alpha)") — doctor reports that pin as trusted from
# acquisition, unverifiable from the binary. Note the two binaries may
# lawfully sit at different wolf-lang pins (two moving upstreams); the
# nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.1 (sc02 bump): DPOR completeness fix, frozen-write trap, when-arity
# code alignment. Its own conformance pin is unchanged — lupin 0.1.1 still
# names cbde620 in `--version`, which is the lawful two-upstream drift the
# header describes.
version = "0.1.1"
pin = "cbde62012f10bbdf63e4ec1e2ebeeed026973d23"

[wolf]
version = "0.0.1"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver.
# sc03 bump: trunk 12ae8c2 — the last green trunk CI run at sprint start,
# and s27 complete: postfix rows in param/let positions (closes
# wolf-lang#3), lowercase bare tags at raise sites (#4), List
# mut-receiver + copy-read typing (#6), `str` ordering ruled
# byte-lexicographic (#7, `[mem.str.order]`), the two-argument `assert`
# intrinsic (#9), the iterator protocol with range-for (#8). Every one of
# those closes a finding this repo filed. `cargo test --workspace` green
# in the scratch clone at that sha before the bump.
pin = "12ae8c2b602bc9fe2830d5d3672e2c6ce8731964"
