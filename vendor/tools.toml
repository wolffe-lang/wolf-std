# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; wolf pre-M1 names none
# ("wolf 0.0.1 (wolfgang)") — doctor reports that pin as trusted from
# acquisition, unverifiable from the binary. Note the two binaries may
# lawfully sit at different wolf-lang pins (two moving upstreams); the
# nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.6 (sc09 bump, tag v0.1.6). lupin names `13b811f` — the sc08 data pin —
# as its own conformance pin, while the `wolf` binary below sits at trunk
# `8321aba`: the lawful two-upstream drift this file's header describes, with
# the nightly lane watching it. The drift narrowed by one wave this bump.
# What the bump changes for this repo, all re-measured:
# - **this machine runs WARNING analyses now** (wolf-interp#19): eleven
#   shared-analysis lints (W0304–W0309, W0401, W0602, W1101, W1102, W1302)
#   with the counterparty's spans, and the record's `warnings` array is
#   populated per `[proto.record.warn]`. The compiler-only four (W0402,
#   W0601, W0801, W1001) stay honest-absent — so the lupin lane is a
#   SECOND warning signal for this rig, still entry-file-only (F-0053).
# - **reads through frozen containers are legal** (wolf-interp#20, spec
#   `[mem.region.freeze.4]`): a method receiver that does not change is not
#   written back, so `frozen[0].body.words()` reads where 0.1.5 trapped
#   `region-fault`. Nothing in this repo's ledger moved on it (no std test
#   reads through a frozen container), recorded because sc02's freeze entry
#   in the guide claimed less than the machine now does.
# - **E1101/E1102/E1103 and E0004 reject at this machine's resolve rung**
#   with wolfc's codes and spans — the #41 capture law is enforced on both
#   implementations at last, which retires the guide's "silent wrong answer
#   on one lane" warning about task captures.
# What it does NOT change: no `fs_*` builtins, no `read_line`, no `net_*` (all
# three declined by design, with a sentence in the refusal), `var k = 0` is
# still `i32`, and `count("")`/`split("")`/`replace("", …)` are still
# refused as `unsupported` rather than defined (F-0055 — std guards them).
version = "0.1.6"
pin = "13b811ffc03092c78873bed1cc9b400d166f04fd"

[wolf]
version = "0.0.1"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver -p wolf_rt.
# sc09 bump: trunk 8321aba — the s36 deterministic-scheduler merge plus its
# two off-linux follow-ups ("gate the w1- token validator behind the task
# layer's linux posture"). NOTHING in the wave reaches this repo's surface:
# s36 is the scheduler (seeded picks, virtual timers, replay from seed or
# `w1-` token, zero scheduler symbols in release builds) and std ships no
# concurrent code at all. Re-measured anyway, because a pin is a pin:
# - the builtin `str` set is unchanged from 13b811f (the s37 21-method set,
#   `get` included), which is what sc09 spends;
# - `count("")`, `split("")` and `replace(s, "", …)` are still REFUSED on
#   the checked lane ("count of an empty needle") while native DEFINES them
#   (0, one whole piece, identity) — the three-lane split F-0055 files and
#   `std.str` now guards ahead of every delegate;
# - `repeat(s, n)` with `n < 0` still traps `bounds` on the checked lane and
#   answers `""` natively and under lupin (F-0056; `std.str.repeat` guards);
# - `--deny-warnings` is STILL rejected by `conform-run` (F-0046/F-0053,
#   re-verified at this sha: `unknown flag`), so the warning gate is still
#   the record's `warnings` array, now read on two lanes (lupin 0.1.6).
#
# THE SECOND GATE (F-0024's lesson, applied for the sixth time): the pin is
# verified by `cargo test --workspace` AND `cargo run -p xtask -- ci` in a
# clean scratch clone at the sha. Both are green at 8321aba **on their first
# attempt** — F-0054's proc-seam flakiness (each gate failed once at
# 13b811f) did not reproduce here, on 1-for-1 evidence. The finding stays
# open: one clean pair is not proof the timing dependence is gone, and the
# lawful posture remains "state the attempt count in this note".
#
# The native rung needs `libwolf_rt.a` beside the binary
# (`cargo build -p wolf_rt` at the same sha, or `$WOLF_RT_LIB`); doctor
# reports its absence and the lane goes dark rather than silent. It executes
# the fs/io tier now and refuses the net tier by name.
pin = "8321aba4e77d16f598a77e7934c146700cbcfa46"
