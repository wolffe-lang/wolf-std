# Binary pins — `cargo xtask doctor`'s contract. This repo consumes
# `lupin` (wolf-interp) and `wolf` (wolf-lang) as binaries only: never
# source, never cargo deps (the ls00 honesty, adopted verbatim).
# Resolution order: $LUPIN_BIN / $WOLF_BIN → .wolf-bin/ → PATH.
#
# `pin` is the wolf-lang commit the binary conforms to. lupin names its
# pin in `--version` and doctor verifies it; wolf pre-M1 names none
# ("wolf 0.0.1 (pre-alpha)") — doctor reports that pin as trusted from
# acquisition, unverifiable from the binary. Note the two binaries may
# lawfully sit at different wolf-lang pins (two moving upstreams); the
# nightly lane watches the drift, report-never-gate.

[lupin]
# 0.1.2 (sc04 bump, tag v0.1.2): four of this repo's filings fixed at once
# — bare-ident patterns dispatch as variant/tag patterns (wolf-interp#5,
# F-0007), both false `ub(mem.ub)` shapes gone with the `drop_frame`
# key repair (#7, F-0013), `let` reassignment rejects at resolve with
# wolfc's exact E0410 (#8, F-0017), and `--std-root`/`LUPIN_STD` lands
# (#6, F-0010) — which is what retired this rig's flat-mirror staging.
# lupin names its own conformance pin a0c4564 in `--version`; the binaries
# sitting at different wolf-lang pins is the lawful two-upstream drift the
# header describes, and the nightly lane watches it.
version = "0.1.2"
pin = "a0c4564f246e46dd14d66f82e7d106059b9d076a"

[wolf]
version = "0.0.1"
# Built from a clean checkout of wolf-lang at the DATA pin (below,
# vendor/upstream/PIN): cargo build --release -p wolf_driver.
# sc04 bump: trunk d147a54 — the last green trunk CI run at sprint start,
# and s28 complete: `wolf build` and `conform-run --native` compile, link
# and EXECUTE (cranelift-object, the scalar core with checked/wrap/sat
# arithmetic and traps surviving as `__wolf_rt_trap` calls), plus the
# ubcheck repair that stops treating `assert`'s message as a second
# condition — which closes F-0020 / wolf-lang#19, the two-argument
# `assert` this repo could not use.
#
# THE SECOND GATE (F-0024's lesson, applied): "the last green trunk CI
# run" is not sufficient by itself, so the pin is also verified by
# `cargo test --workspace` in a clean scratch clone at the sha. It is
# GREEN at d147a54 (96 test binaries), where 12ae8c2 was red — the gate
# earns its keep on its first use.
#
# The native rung needs `libwolf_rt.a` beside the binary
# (`cargo build -p wolf_rt` at the same sha, or `$WOLF_RT_LIB`); doctor
# reports its absence and the lane goes dark rather than silent.
pin = "d147a548fa114052fb070e5a7815acd0500fb3d9"
